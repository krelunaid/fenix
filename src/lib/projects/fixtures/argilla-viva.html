<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<title>Argilla Viva</title>
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--accent:#0071e3}
body{font-family:Inter,system-ui,sans-serif;background:#f5f5f7;color:#1d1d1f;margin:0}
.modal{display:none;position:fixed;inset:0;background:#fff;padding:24px}
.modal.open{display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <strong>Argilla Viva</strong>
  <nav>
    <button type="button" data-view="dash">Dashboard</button>
    <button type="button" data-view="inv" class="on">Inventario</button>
    <button type="button" data-view="ord">Ordini</button>
    <button type="button" data-view="cli">Clienti</button>
  </nav>
</header>
<main>
  <section data-view-panel="dash" hidden><h1>Dashboard</h1></section>
  <section data-view-panel="inv">
    <h1>Inventario</h1>
    <p>Persistenza via ,</p>
    <button type="button" id="btn-new">+ Nuovo pezzo</button>
    <table>
      <thead>
        <tr><th>Nome</th><th>Categoria</th><th>Stato</th><th>Quantità</th><th>Prezzo</th><th>Azioni</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td>Ciotola</td><td>Terraglia</td><td>in laboratorio</td><td>4</td><td>12</td>
          <td><button type="button" class="edit">Modifica</button></td></tr>
      </tbody>
    </table>
    <div class="modal" id="modal" hidden>
      <form id="form-pezzo">
        <label>Nome</label>
        <input id="p-nome" placeholder="Nome del pezzo"/>
        <label>Categoria</label>
        <select id="p-cat"><option>Terraglia</option><option>Gres</option></select>
        <label>Stato</label>
        <select id="p-stato"><option>in laboratorio</option><option>in vetrina</option></select>
        <label>Quantità</label>
        <input id="p-qty" type="number" value="1"/>
        <label>Prezzo</label>
        <input id="p-prezzo" type="number" step="0.01" value="0"/>
        <button type="button" id="btn-cancel">Annulla</button>
        <button type="submit" id="btn-save">Salva</button>
      </form>
    </div>
  </section>
  <section data-view-panel="ord" hidden><h1>Ordini</h1></section>
  <section data-view-panel="cli" hidden><h1>Clienti</h1></section>
</main>
<script>
  /* Original Argilla: overwrites the host Fenix, form.nome does not exist, Nuovo is a no-op. */
  window.Fenix = {
    load: function(){ return Promise.resolve({ items: [] }); },
    save: function(){ return Promise.resolve(); }
  };
  var modal = document.getElementById("modal");
  var form = document.getElementById("form-pezzo");
  document.getElementById("btn-new").addEventListener("click", function(){
    /* intended showModal on a div — no-op */
  });
  document.querySelectorAll(".edit").forEach(function(b){
    b.addEventListener("click", function(){
      modal.hidden = false;
      modal.classList.add("open");
    });
  });
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var nome = form.nome && form.nome.value;
    if (!nome) return;
    window.Fenix.save("state", { nome: nome });
    modal.hidden = true;
  });
  document.querySelectorAll("[data-view]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-view");
      document.querySelectorAll("[data-view-panel]").forEach(function(p){
        p.hidden = p.getAttribute("data-view-panel") !== id;
      });
    });
  });
  document.documentElement.setAttribute("data-fenix-ready","1");
</script>
</body>
</html>
