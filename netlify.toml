[build]
  # Force the Netlify Nitro preset even for a local `netlify deploy --build`.
  # Clear both possible Vite/Nitro outputs so a stale node-preset bundle can
  # never be uploaded as a static-only deploy (which would make every route 404).
  command = "rm -rf dist .output .netlify/functions-internal && NETLIFY=true node scripts/with-app-env.mjs ./node_modules/.bin/vite build && node scripts/copy-pglite-assets.mjs && node scripts/sync-static-publish.mjs && node scripts/migrate.mjs"
  publish = ".output/public"

[build.environment]
  VITE_AUTH_ENABLED = "true"

# /__worker/* is served by netlify/functions/worker-proxy.ts (adds VISUAL_WORKER_TOKEN
# server side). The old direct redirect to Railway exposed the worker to anyone.

[[edge_functions]]
  path = "/api/build"
  function = "build"
