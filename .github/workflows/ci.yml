name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Verified Gradle wrapper jar
        run: |
          dest=workers/release/vendor/gradle-wrapper.jar
          mkdir -p workers/release/vendor
          if [ ! -s "$dest" ]; then
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o "$dest"
          fi
          echo "cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8  $dest" | sha256sum -c -
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/secret-scan.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
